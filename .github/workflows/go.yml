name: go
on: [push]

jobs:

  build:
    name: lint, build & test

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

      - name: build
        run: go build -race -v ./...

      - name: test
        run: go test -cover -race ./...
